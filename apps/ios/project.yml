name: HermesBots
options:
  bundleIdPrefix: dev.tsnanh.hermes
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: G94PJ7VQBJ
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  HermesKit:
    path: Packages/HermesKit
  HermesDesign:
    path: Packages/HermesDesign
targets:
  HermesBots:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hermes Bots
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tsnanh.hermes.bot
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: HermesKit
        product: HermesProtocol
      - package: HermesKit
        product: HermesDiagnostics
      - package: HermesKit
        product: HermesREST
      - package: HermesKit
        product: HermesAuth
      - package: HermesKit
        product: HermesTransport
      - package: HermesKit
        product: HermesClient
      - package: HermesKit
        product: HermesChat
      - package: HermesKit
        product: HermesRoster
      - package: HermesKit
        product: HermesBotProfile
      - package: HermesDesign
        product: HermesDesign
  HermesBotsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tsnanh.hermes.bot.uitests
        TEST_TARGET_NAME: HermesBots
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HermesBots
      - package: HermesDesign
        product: HermesDesign
schemes:
  HermesBots:
    build:
      targets:
        HermesBots: all
    test:
      targets:
        - HermesBotsUITests
