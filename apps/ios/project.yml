name: HermesBots
options:
  bundleIdPrefix: dev.tsnanh.hermes
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: G94PJ7VQBJ
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  HermesKit:
    path: Packages/HermesKit
  HermesDesign:
    path: Packages/HermesDesign
targets:
  HermesBots:
    type: application
    platform: iOS
    sources:
      - App
    entitlements:
      path: App/HermesBots.entitlements
      properties:
        aps-environment: development
        com.apple.developer.homekit: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hermes Bots
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Hermes Bots listens while you dictate a message or talk to a bot in voice mode.
        NSSpeechRecognitionUsageDescription: Hermes Bots turns your speech into text on this device for dictation and voice mode.
        NSCameraUsageDescription: Hermes Bots can take a photo to send to a bot.
        UILaunchScreen: {}
        NSCalendarsFullAccessUsageDescription: Hermes reads your calendar and adds events when you ask your bot to.
        NSRemindersFullAccessUsageDescription: Hermes reads and adds your reminders when you ask your bot to.
        NSContactsUsageDescription: Hermes looks up people in your contacts when you ask your bot to.
        NSLocationWhenInUseUsageDescription: Hermes uses your location to tell your bot where you are and to find places near you.
        NSHomeKitUsageDescription: Hermes controls your lights, locks and other home accessories when you ask your bot to.
        NSAlarmKitUsageDescription: Hermes sets alarms and timers when you ask your bot to.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tsnanh.hermes.bot
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: HermesKit
        product: HermesProtocol
      - package: HermesKit
        product: HermesDiagnostics
      - package: HermesKit
        product: HermesREST
      - package: HermesKit
        product: HermesAuth
      - package: HermesKit
        product: HermesTransport
      - package: HermesKit
        product: HermesClient
      - package: HermesKit
        product: HermesChat
      - package: HermesKit
        product: HermesRoster
      - package: HermesKit
        product: HermesBotProfile
      - package: HermesKit
        product: HermesRFB
      - package: HermesKit
        product: HermesDevice
      - package: HermesKit
        product: HermesConnect
      - package: HermesKit
        product: HermesSettings
      - package: HermesDesign
        product: HermesDesign
  HermesBotsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tsnanh.hermes.bot.uitests
        TEST_TARGET_NAME: HermesBots
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HermesBots
      - package: HermesDesign
        product: HermesDesign
schemes:
  HermesBots:
    build:
      targets:
        HermesBots: all
    test:
      targets:
        - HermesBotsUITests
